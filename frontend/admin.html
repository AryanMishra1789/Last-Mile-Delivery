<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch Admin</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><span class="eyebrow">NORTHSTAR LOGISTICS / ADMIN</span><h1>Control room</h1><p>Review every delivery in the network.</p></div><div><button onclick="location.href='/'">Customer view</button></div></header><section class="panel"><h3>Admin sign in</h3><div class="grid"><input id="email" value="admin@example.com"><input id="password" type="password" value="admin123"><button class="primary" onclick="adminLogin()">Open operations</button></div><output id="message"></output></section><section id="content" class="hidden"><div class="toolbar"><div><h2>All orders</h2><p>Use the API documentation for assignment, rates, zones, and overrides.</p></div></div><div id="orders" class="orders"></div></section></main><script src="config.js"></script><script>const API=(window.DELIVERY_API_URL||'http://localhost:8000').replace(/\/$/,'');let token='';async function adminLogin(){const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){message.textContent=d.detail;return}token=d.access_token;content.classList.remove('hidden');load()}async function load(){const r=await fetch(API+'/api/orders',{headers:{Authorization:'Bearer '+token}});const d=await r.json();orders.innerHTML=d.map(o=>`<article class="order"><div class="order-id">#${String(o.id).padStart(4,'0')}</div><div class="route">${o.pickup_address} -> ${o.drop_address}<small>${o.order_type} / ${o.payment_type}</small></div><div class="agent">${o.agent||'Unassigned'}</div><div class="status">${o.status}</div><div class="price">Rs ${o.charge}</div></article>`).join('')||'<p>No orders yet.</p>'}</script></body></html>
