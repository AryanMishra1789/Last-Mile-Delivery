<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch Operations</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><span class="eyebrow">NORTHSTAR LOGISTICS / OPERATIONS</span><h1>Control room</h1><p>Coordinate every delivery from one operations view.</p></div><div><button onclick="location.href='/'">Customer view</button></div></header><section class="panel"><h3>Operations workspace</h3><p>Review delivery activity, assignment, status, and charges across the network.</p><button class="primary" onclick="loadOrders()">Refresh orders</button></section><section><div class="toolbar"><div><h2>All orders</h2></div></div><div id="orders" class="orders"></div></section></main><script>function loadOrders(){const orders=JSON.parse(localStorage.getItem('last_mile_demo_orders')||'[]');document.querySelector('#orders').innerHTML=orders.length?orders.map(o=>`<article class="order"><div class="order-id">#${String(o.id).slice(-4)}</div><div class="route">${o.pickup} -> ${o.drop}<small>${o.orderType} / ${o.paymentType}</small></div><div class="agent">Assigned agent</div><div class="status">${o.status}</div><div class="price">Rs ${o.charge}</div></article>`).join(''):'<p>No orders yet.</p>'}loadOrders();</script></body></html>
