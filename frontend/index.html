<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch Desk</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><span class="eyebrow">NORTHSTAR LOGISTICS</span><h1>Dispatch Desk</h1><p>Every parcel, accounted for.</p></div><div id="session"><button onclick="login()">Open customer workspace</button></div></header><section class="stats"><article><small>ACTIVE DELIVERIES</small><strong id="active">--</strong><span>Live across your network</span></article><article><small>ON-TIME RATE</small><strong>96.4%</strong><span class="good">+2.1% this week</span></article><article><small>ATTENTION NEEDED</small><strong id="attention">--</strong><span>Failed or pending</span></article></section><section class="toolbar"><div><h2>Delivery board</h2><p>Track the journey from pickup to doorstep.</p></div><button class="primary" onclick="showForm()">+ Create delivery</button></section><div id="form" class="panel hidden"><h3>New delivery</h3><div class="grid"><input id="pickup" placeholder="Pickup address"><input id="drop" placeholder="Drop address"><input id="pp" placeholder="Pickup pincode" value="110001"><input id="dp" placeholder="Drop pincode" value="560001"><input id="weight" type="number" placeholder="Actual weight (kg)" value="2"><input id="dims" placeholder="L x B x H (cm)" value="20 x 20 x 20"><select id="kind"><option>B2C</option><option>B2B</option></select><select id="payment"><option>Prepaid</option><option>COD</option></select></div><button class="primary" onclick="createOrder()">Calculate & place order</button><output id="quote"></output></div><div id="orders" class="orders"></div></main><script src="app.js"></script></body></html>
